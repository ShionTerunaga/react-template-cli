name: Sync Release Branch

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sync-release-branch
  cancel-in-progress: true

jobs:
  sync-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build release artifacts
        run: pnpm build

      - name: Commit generated CLI updates to main
        run: |
          if [ -z "$(git status --short -- bin)" ]; then
            echo "No generated CLI updates."
            exit 0
          fi

          git add bin
          git commit -m "chore: build release artifacts"
          git push origin HEAD:main

      - name: Sync release branch to latest main
        id: sync-release
        run: |
          git fetch origin main
          git push origin origin/main:refs/heads/release --force
          echo "after_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.sync-release.outputs.after_sha }}
        run: |
          VERSION="$(node --print "require('./package.json').version")"
          export VERSION
          node scripts/release/sync-github-release.mts
